name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  quality:
    name: CI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: emerge
          POSTGRES_PASSWORD: emerge_dev_password
          POSTGRES_DB: emerge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U emerge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - name: Migrations run clean on a fresh database
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://emerge:emerge_dev_password@localhost:5432/emerge
      - run: pnpm build

  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  e2e:
    name: E2E smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report

  compose-smoke:
    name: Compose smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Boot the full stack
        run: |
          cp .env.example .env
          docker compose up -d --build
      - name: Wait for health endpoint
        run: |
          for i in $(seq 1 60); do
            status=$(curl -s -o /tmp/health.json -w "%{http_code}" http://localhost:3000/api/health || true)
            if [ "$status" = "200" ]; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 5
          done
          echo "Health endpoint never became healthy"
          docker compose logs
          exit 1
      - name: Tear down
        if: always()
        run: docker compose down -v
